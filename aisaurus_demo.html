<!DOCTYPE html>
<title>AIsaurus | AI Glossary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /*
    Layout: Claymorphic App.
    Soft, puffy, rounded surfaces with depth.
    Single-page interactive experience.
  */
  :root {
    --bg: #F3F0FF; /* Soft Lavender Base */
    --fg: #4A3F6B;
    --primary: #7C3AED; /* Violet Primary */
    --primary-soft: #DDD6FE;
    --accent-peach: #FFD8B1; 
    --accent-mint: #BBF7D0;
    --accent-sunflower: #FDE047;
    --surface: #FFFFFF;
    --surface-shadow: #C7C1E0;
    --text-main: #4A3F6B;
    --text-muted: #8B83B1;

    --font-display: 'Bricolage Grotesque', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;

    --radius-puffy: 32px;
    --radius-card: 24px;
    --shadow-clay: 8px 8px 16px var(--surface-shadow),
                    -8px -8px 16px #FFFFFF;
    --shadow-inner: inset 4px 4px 8px var(--surface-shadow),
                     inset -4px -4px 8px #FFFFFF;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2D2842;
      --fg: #E0D9F0;
      --primary: #A78BFA;
      --primary-soft: #4C3E8A;
      --accent-peach: #D9A57D;
      --accent-mint: #7FB68F;
      --accent-sunflower: #B5A63A;
      --surface: #3B3454;
      --surface-shadow: #241F36;
      --text-main: #E0D9F0;
      --text-muted: #A096B8;
      --shadow-clay: 8px 8px 16px var(--surface-shadow),
                    -8px -8px 16px #453E5E;
      --shadow-inner: inset 4px 4px 8px var(--surface-shadow),
                     inset -4px -4px 8px #453E5E;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #2D2842;
    --fg: #E0D9F0;
    --primary: #A78BFA;
    --primary-soft: #4C3E8A;
    --accent-peach: #D9A57D;
    --accent-mint: #7FB68F;
    --accent-sunflower: #B5A6B3A;
    --surface: #3B3454;
    --surface-shadow: #241F36;
    --text-main: #E0D9F0;
    --text-muted: #A096B8;
    --shadow-clay: 8px 8px 16px var(--surface-shadow),
                  -8px -8px 16px #453E5E;
    --shadow-inner: inset 4px 4px 8px var(--surface-shadow),
                   inset -4px -4px 8px #453E5E;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-body);
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
    min-height: 100%;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    margin: 0;
  }

  /* --- Claymorphism Components --- */
  .clay-card {
    background: var(--surface);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-clay);
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.2);
    transition: transform 0.2s ease;
  }

  .clay-button {
    background: var(--surface);
    border: none;
    border-radius: var(--radius-puffy);
    padding: 12px 24px;
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: var(--shadow-clay);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .clay-button:active {
    box-shadow: var(--shadow-inner);
    transform: scale(0.96);
  }

  .clay-input {
    background: var(--surface);
    border: none;
    border-radius: var(--radius-puffy);
    padding: 16px 24px;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-main);
    box-shadow: var(--shadow-inner);
    width: 100%;
    box-sizing: border-box;
    outline: none;
    transition: box-shadow 0.2s ease;
  }

  .clay-input:focus {
    box-shadow: var(--shadow-clay);
  }

  /* --- UI Sections --- */
  .app-container {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 42px;
    color: var(--primary);
    font-weight: 800;
    margin-bottom: 8px;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-pill {
    background: var(--surface);
    padding: 6px 16px;
    border-radius: var(--radius-puffy);
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow-clay);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .search-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .term-card {
    width: 100%;
    max-width: 600px;
    position: relative;
    animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .badge-glossary { background: var(--accent-mint); color: #166534; }
  .badge-ai { background: var(--accent-peach); color: #9a3412; }
  .badge-safe { background: var(--accent-sunflower); color: #854d0e; }

  .term-title {
    font-size: 32px;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .explanation-line {
    font-size: 18px;
    margin-bottom: 24px;
    min-height: 1.5em;
  }

  .model-box {
    background: var(--primary-soft);
    padding: 16px;
    border-radius: var(--radius-card);
    margin-bottom: 20px;
    box-shadow: var(--shadow-inner);
    font-style: italic;
  }

  .example-box {
    border-left: 4px solid var(--primary);
    padding-left: 16px;
    margin-bottom: 24px;
    color: var(--text-muted);
  }

  .quiz-section {
    margin-top: 32px;
    padding-top: 32px;
    border-top: 2px dashed var(--primary-soft);
  }

  .quiz-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .option-btn {
    background: var(--surface);
    border: 2px solid transparent;
    border-radius: var(--radius-card);
    padding: 16px;
    text-align: left;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 16px;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-clay);
  }

  .option-btn:hover {
    border-color: var(--primary);
    transform: translateX(4px);
  }

  .option-btn.correct {
    background: var(--accent-mint);
    border-color: #22c55e;
  }

  .option-btn.wrong {
    background: #fee2e2;
    border-color: #ef4444;
  }

  .feedback-box {
    margin-top: 16px;
    padding: 16px;
    border-radius: var(--radius-card);
    font-size: 14px;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .approval-card {
    background: var(--accent-sunflower);
    border: 3px solid #facc15;
    color: #854d0e;
    text-align: center;
  }

  .approval-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }

  /* Mobile adjustments */
  @media (max-width: 480px) {
    body { padding-block: 20px; }
    .logo { font-size: 32px; }
    .term-title { font-size: 24px; }
    .stats-bar { flex-wrap: wrap; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;1,400&display=swap">

<div class="app-container">
  <header class="header">
    <div class="logo">AIsaurus</div>
    <div class="stats-bar">
      <div class="stat-pill">🔥 12 Day Streak</div>
      <div class="stat-pill">✨ 1,240 XP</div>
      <div class="stat-pill">💎 50 Credits</div>
      <div class="stat-pill" style="background: var(--accent-sunflower);">🛡️ Safe Mode</div>
    </div>
  </header>

  <div class="search-section">
    <input type="text" id="termSearch" class="clay-input" placeholder="Search any AI term (e.g. RAG, LLM)..." autocomplete="off">

    <div id="termDisplay" class="term-card clay-card">
      <!-- Term content injected here -->
    </div>
  </div>

  <div id="approvalArea"></div>
</div>

<script>
  const glossary = {
    "rag": "Retrieval-Augmented Generation - the model looks up documents before answering.",
    "llm": "Large Language Model - an AI trained on huge text to predict the next word.",
    "mcp": "Model Context Protocol - a standard way to connect AI apps to tools and data.",
    "token": "A small chunk of text (about 3/4 of a word) that models read and write.",
    "hallucination": "When an AI confidently says something that is false.",
    "lora": "Low-Rank Adaptation - a cheap way to fine-tune a big model with few extra weights."
  };

  const mockAI = {
    "rag": {
      mentalModel: "Like an open-book exam: instead of relying on memory, the AI looks at a textbook first.",
      example: "A customer support bot reading your company's latest PDF manual to answer a specific question.",
      quiz: {
        question: "What is the primary benefit of RAG over a standard LLM?",
        options: ["Faster response time", "Ability to use real-time, private data", "Lower compute cost", "Better poetry generation"],
        correct: 1,
        feedback: "Correct! RAG allows the AI to 'retrieve' current data it wasn't originally trained on."
      }
    },
    "llm": {
      mentalModel: "A super-powered autocomplete that has read almost everything on the internet.",
      example: "Writing a formal email by giving the AI three bullet points of what you want to say.",
      quiz: {
        question: "How does an LLM primarily generate text?",
        options: ["By looking up a database of answers", "By predicting the most likely next token", "By thinking like a human brain", "By following a rigid set of if-then rules"],
        correct: 1,
        feedback: "Exactly! LLMs are probabilistic engines predicting the next word based on patterns."
      }
    }
  };

  const termSearch = document.getElementById('termSearch');
  const termDisplay = document.getElementById('termDisplay');
  const approvalArea = document.getElementById('approvalArea');

  function typeWriter(element, text, callback) {
    let i = 0;
    element.innerHTML = '';
    const interval = setInterval(() => {
      element.innerHTML += text.charAt(i);
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        if (callback) callback();
      }
    }, 20);
  }

  function renderTerm(term) {
    const key = term.toLowerCase();
    const definition = glossary[key] || "Term not found in glossary. Generating AI explanation...";
    const aiData = mockAI[key] || {
      mentalModel: "A conceptual bridge to understand this complex AI behavior.",
      example: "A practical scenario where this technology improves a real-world workflow.",
      quiz: {
        question: "Which of these best describes this term?",
        options: ["Option A", "Option B", "Option C", "Option D"],
        correct: 0,
        feedback: "This is a general AI-generated explanation."
      }
    };

    const isGlossary = !!glossary[key];

    termDisplay.innerHTML = `
      <div class="badge ${isGlossary ? 'badge-glossary' : 'badge-ai'}">${isGlossary ? 'From AIsaurus Glossary' : 'AI-Generated'}</div>
      <h2 class="term-title">${term}</h2>
      <div class="explanation-line" id="explainText"></div>
      <div class="model-box"><strong>Mental Model:</strong> <span id="modelText"></span></div>
      <div class="example-box"><strong>Real-time Example:</strong> <span id="exampleText"></span></div>

      <div class="quiz-section">
        <h3>Quick Quiz</h3>
        <p id="quizQuestion"></p>
        <div class="quiz-options" id="quizOptions"></div>
        <div id="quizFeedback" class="feedback-box"></div>
      </div>
    `;

    // Streaming simulation
    typeWriter(document.getElementById('explainText'), definition, () => {
      typeWriter(document.getElementById('modelText'), aiData.mentalModel, () => {
        typeWriter(document.getElementById('exampleText'), aiData.example, () => {
          setupQuiz(aiData.quiz);
        });
      });
    });
  }

  function setupQuiz(quiz) {
    document.getElementById('quizQuestion').innerText = quiz.question;
    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = '';

    quiz.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => {
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (idx === quiz.correct) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
          allBtns[quiz.correct].classList.add('correct');
        }

        const fb = document.getElementById('quizFeedback');
        fb.style.display = 'block';
        fb.style.background = idx === quiz.correct ? 'var(--accent-mint)' : '#fee2e2';
        fb.innerText = quiz.feedback;
      };
      optionsContainer.appendChild(btn);
    });
  }

  function showApprovalCard() {
    approvalArea.innerHTML = `
      <div class="term-card clay-card approval-card">
        <h3>New Term Suggested!</h3>
        <p>AI found <strong>"Agentic Workflow"</strong> in a recent paper. Add it to the official glossary?</p>
        <div class="approval-actions">
          <button class="clay-button" onclick="this.parentElement.parentElement.remove()">Approve</button>
          <button class="clay-button" onclick="this.parentElement.parentElement.remove()">Edit</button>
          <button class="clay-button" onclick="this.parentElement.parentElement.remove()">Reject</button>
        </div>
      </div>
    `;
  }

  termSearch.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      renderTerm(termSearch.value);
    }
  });

  // Init
  renderTerm('RAG');
  setTimeout(showApprovalCard, 5000);
</script>
